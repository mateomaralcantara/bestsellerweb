name: LibroSeller 9.x Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/libroseller-9x-platform-hardening]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_only
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PAYPAL_CLIENT_ID: ci-client
      PAYPAL_CLIENT_SECRET: ci-secret
      PAYPAL_WEBHOOK_ID: ci-webhook
      PAYPAL_ENV: sandbox
      PAYPAL_DEFAULT_CURRENCY: USD
      NEXT_PUBLIC_SITE_URL: https://www.libroseller.com
      RATE_LIMIT_SECRET: ci-rate-limit-secret-with-at-least-32-characters
      HEALTHCHECK_SECRET: ci-health-secret-with-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Security tests
        run: npm test

      - name: Static security guard
        run: npm run security:check

      - name: Production build
        run: npm run build

name: Apply EPUB Publication Hard Gate

on:
  push:
    branches: [feature/epub-publication-hard-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply EPUB publication hard gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/epub-publication-hard-gate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source patch
        run: node scripts/apply-epub-publication-hard-gate.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Diff check
        run: git diff --check

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "LibroSeller Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/books/[bookkey]/route.ts app/api/books/[bookkey]/preflight/route.ts app/api/books/[bookkey]/epub-upload/route.ts
          git commit -m "Apply EPUB publication hard gate"
          git push origin HEAD:feature/epub-publication-hard-gate
